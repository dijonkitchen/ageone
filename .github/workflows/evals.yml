# Offline checks of the harness config and eval runner; no model calls and no API keys.
# See specs/SPEC-2026-09-26-vendor-neutral-ai-harness.md and evals/README.md.
name: Evals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pi settings match the roles file
        run: harness/sync --check
      - name: Graders pass the reference solutions and fail the null baseline
        run: evals/run --self-check
      - name: Runner records metrics through pi and direct mode against a mock model
        run: evals/test/run
      - name: Format experiment cases match their generator
        run: experiments/formats/generate && git diff --exit-code -- experiments/formats
      - name: Experiment graders pass reference solutions and fail null baselines
        run: for d in experiments/formats/variants/*/; do evals/run --self-check --cases "$d" || exit 1; done
      - name: Prompt injection cases match their generator
        run: experiments/prompt-injection/generate && git diff --exit-code -- experiments/prompt-injection
      - name: Prompt injection graders pass reference solutions and fail null baselines
        run: for d in experiments/prompt-injection/variants/*/; do evals/run --self-check --cases "$d" || exit 1; done
