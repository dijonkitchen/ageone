# Build the eval and benchmark pages from committed results on every pull request; publish them from main.
# Publishing needs GitHub Pages set to "GitHub Actions" in the repository's settings (once).
# The POSSE bliki shares this deploy under /bliki/ (GitHub Pages serves one site per repository).
# See specs/SPEC-2026-09-27-eval-benchmark-pages.md and projects/posse-bliki/.
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: site/build
      - uses: astral-sh/setup-uv@v6
      - name: Build the POSSE bliki into _site/bliki
        run: uv run --project projects/posse-bliki bliki --root projects/posse-bliki build --out "$PWD/_site/bliki"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Send Webmentions for recent posts
        continue-on-error: true
        run: uv run --project projects/posse-bliki bliki --root projects/posse-bliki webmention
