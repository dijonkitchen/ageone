# Build the eval and benchmark pages from committed results, and the SimpleFit PWA, on every pull request; publish them from main.
# Publishing needs GitHub Pages set to "GitHub Actions" in the repository's settings (once).
# See specs/SPEC-2026-09-27-eval-benchmark-pages.md.
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: site/build
      # SimpleFit, the fitness PWA (projects/simplefit), is published at <pages>/simplefit/.
      - uses: oven-sh/setup-bun@v2
      - name: Build SimpleFit into the site
        run: cd projects/simplefit && bun install --frozen-lockfile && bun build.ts ../../_site/simplefit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
