# Tests for the stock screener (SPEC-2026-10-03-stock-screener): recorded fixtures only, no network to the SEC.
name: Stock screener

on:
  pull_request:
    paths:
      - "projects/stock-screener/**"
      - ".github/workflows/stock-screener.yml"
  push:
    branches: [main]
    paths:
      - "projects/stock-screener/**"
      - ".github/workflows/stock-screener.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stock-screener
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: projects/stock-screener/uv.lock
      - name: Install the locked environment
        run: uv sync --locked
      - name: Test
        run: uv run pytest
