[project]
name = "aiprofile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-allauth>=65.20.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiprofile"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "aiprofile.settings"

[tool.ruff.lint.per-file-ignores]
"src/aiprofile/migrations/*" = ["RUF012"]
"src/aiprofile/models.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "aiprofile.settings"
pythonpath = ["src"]
