[project]
name = "mle-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1",
    "ruff>=0.17.2",
]

[project.scripts]
mle = "mle_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mle_lab"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# scikit-learn ships no type hints.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
