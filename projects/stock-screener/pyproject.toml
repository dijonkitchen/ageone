[project]
name = "screener"
version = "0.1.0"
description = "Stock screener on SEC EDGAR XBRL data (SPEC-2026-10-03-stock-screener)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned: our tests record its standardized output, and the spot check reruns on each upgrade.
    "openbb-sec==2.0.0",
    "openbb-core==2.0.1",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "streamlit>=1.40",
    "tomli-w>=1.0",
]

[project.scripts]
screener = "screener.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
