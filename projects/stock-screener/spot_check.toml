# Spot check (SPEC-2026-10-03-stock-screener): values read from 10-K filings,
# on today's share basis (per-share values filed before a split are divided by
# its ratio). Run `screener refresh --tickers AAPL,MSFT` then
# `screener spot-check`, and again after every OpenBB upgrade.
#
# Each value is the one in the latest 10-K reporting that year, so a later
# restatement wins however many years on it came: MSFT 2016 is the 2.56 the
# fiscal 2018 10-K restated it to for ASC 606, not the 2.10 first reported.
#
# EPS is diluted EPS as filed. BVPS is total stockholders' equity divided by
# common shares outstanding at fiscal year end, both from the balance sheet.
# Checked against the SEC's Company Facts for those filings on 2026-10-03.

tolerance = 0.01  # relative

[[companies]]
ticker = "AAPL"
note = "7-for-1 split in fiscal 2014 and 4-for-1 in fiscal 2020; fiscal 2018 and later EPS are restated in the fiscal 2020 10-K or after, earlier years are divided by the ratios."

