[project]
name = "posse-bliki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "html5lib>=1.1",
    "mf2py>=2.0.2",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
bliki = "posse_bliki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posse_bliki"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# Test-only parsers that ship no type hints.
module = ["mf2py", "feedparser"]
ignore_missing_imports = true
