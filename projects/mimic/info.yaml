# Tiny Tapeout project information
project:
  title:        "Mimic protocol emulator"
  author:       "dijonkitchen"
  discord:      ""
  description:  "Four programmable state machines that bit-bang UART, SPI, I2C, WS2812 and protocols they were not designed for"
  language:     "Verilog"
  clock_hz:     60000000

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dijonkitchen_mimic"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "mimic_host.v"
    - "mimic_imem.v"
    - "mimic_fifo.v"
    - "mimic_sm.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# Every pin but the host port is a GPIO the state machines program (GPIO numbers in brackets).
pinout:
  # Inputs
  ui[0]: "GPIO16"
  ui[1]: "GPIO17"
  ui[2]: "GPIO18"
  ui[3]: "GPIO19"
  ui[4]: "GPIO20"
  ui[5]: "HOST_CS_N (GPIO21)"
  ui[6]: "HOST_SCK (GPIO22)"
  ui[7]: "HOST_MOSI (GPIO23)"

  # Outputs
  uo[0]: "GPIO8"
  uo[1]: "GPIO9"
  uo[2]: "GPIO10"
  uo[3]: "GPIO11"
  uo[4]: "GPIO12"
  uo[5]: "GPIO13"
  uo[6]: "GPIO14"
  uo[7]: "HOST_MISO"

  # Bidirectional pins
  uio[0]: "GPIO0"
  uio[1]: "GPIO1"
  uio[2]: "GPIO2"
  uio[3]: "GPIO3"
  uio[4]: "GPIO4"
  uio[5]: "GPIO5"
  uio[6]: "GPIO6"
  uio[7]: "GPIO7"

# Do not change!
yaml_version: 6
