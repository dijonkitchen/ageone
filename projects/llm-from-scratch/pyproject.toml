[project]
name = "llm-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.8", "numpy>=2.2"]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.16"]
# Only for llm_from_scratch.compare, which downloads a published model to compare against.
compare = ["transformers>=4.57"]

[tool.uv.sources]
# On Linux use PyTorch's CPU wheels (the default ones pull in gigabytes of CUDA libraries);
# macOS wheels come from PyPI and include the Apple GPU (MPS) backend.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_from_scratch"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
