[project]
name = "prompt-injection-prevention"
version = "0.1.0"
description = "CaMeL-style prompt injection defenses (SPEC-2026-09-30-prompt-injection-skill)."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_injection_prevention"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
